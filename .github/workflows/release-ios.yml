name: Package iOS
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: node --test
      - name: Build the device package
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            bash scripts/package-ios.sh "$GITHUB_REF_NAME"
          else
            bash scripts/package-ios.sh
          fi
      - name: Upload a candidate for device testing
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ios-candidate
          path: build/ios/
          if-no-files-found: error
          retention-days: 7
      - name: Publish the IPA and checksum
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/ios/*.ipa build/ios/*.sha256 \
            --verify-tag --title "BFI Lab ${GITHUB_REF_NAME#v}" --generate-notes
